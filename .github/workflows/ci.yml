name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npm run tests

  integration:
    name: Integration tests against Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The tests make git worktrees and commits of their own.
      - uses: actions/checkout@v7
      - run: |
          git config --global user.name "dev-env CI"
          git config --global user.email "ci@users.noreply.github.com"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: docker compose version
      - run: npm ci
      - run: npm run tests:integration

  package:
    name: Package installs and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm pack
      # A fresh project installs the tarball as a user would, and the command answers without the source.
      - run: |
          mkdir -p ../consumer/apps/api
          cd ../consumer
          git init --quiet
          echo '{ "private": true, "type": "module", "workspaces": ["apps/*"] }' > package.json
          echo '{ "name": "api", "type": "module" }' > apps/api/package.json
          echo "export default { services: {} }" > apps/api/dev-env.ts
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/evandam93-dev-env-*.tgz
          npx --no dev-env info | tee info.txt
          grep -q 'Available: api' info.txt
